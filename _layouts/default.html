<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description | default: site.title }}">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #fcfcfd; --fg: #18181b; --muted: #71717a; --accent: #18181b;
            --card: #f4f4f5; --border: #e4e4e7;
        }
        [data-theme="dark"] {
            --bg: #0b0b0d; --fg: #fafafa; --muted: #a1a1aa; --accent: #fafafa;
            --card: #18181b; --border: #27272a;
        }
        html { scroll-behavior: smooth; }
        body {
            margin: 0; background: var(--bg); color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Nav */
        .site-header { border-bottom: 1px solid var(--border); }
        .nav { max-width: 720px; margin: 0 auto; padding: 0.9rem 1.25rem; display: flex; align-items: center; gap: 1rem; }
        .nav .brand { font-weight: 700; color: var(--fg); font-size: 1.1rem; }
        .nav-links { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
        .nav-links a { color: var(--fg); opacity: 0.85; }
        .nav-links a:hover { opacity: 1; text-decoration: none; }
        #theme-toggle {
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; padding: 0;
            background: none; border: 1px solid var(--border); border-radius: 50%;
            cursor: pointer; color: var(--fg);
        }
        #theme-toggle .icon-sun { display: none; }
        [data-theme="dark"] #theme-toggle .icon-moon { display: none; }
        [data-theme="dark"] #theme-toggle .icon-sun { display: block; }

        /* Main */
        main { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }

        /* Main */
        .hero { text-align: center; margin-bottom: 3rem; }
        .avatar {
            width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--border);
        }
        .hero h1 { margin: 0.9rem 0 0.4rem; font-size: 2rem; }
        .hero .tagline { color: var(--muted); margin: 0 auto; max-width: 44ch; }

        /* Sections */
        section { margin-bottom: 3rem; }
        section h2 { font-size: 1.25rem; margin: 0 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }

        /* Collection cards */
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
        .card {
            display: block; background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 1.1rem 1.25rem; color: var(--fg);
            transition: transform 0.12s ease, border-color 0.12s ease;
        }
        .card:hover { transform: translateY(-2px); border-color: var(--accent); text-decoration: none; }
        .card strong { display: block; margin-bottom: 0.25rem; }
        .card span { color: var(--muted); font-size: 0.92rem; }

        /* Blog post list */
        .posts { list-style: none; padding: 0; margin: 0; }
        .posts li { display: flex; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
        .posts .date {
            color: var(--muted);
            white-space: nowrap;
        }

        .site-footer {
            border-top: 1px solid var(--border);
            color: var(--muted);
            text-align: center;
            font-size: 0.9rem;
            padding: 1.5rem 1.25rem;
        }
    </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ "/" | relative_url }}">Home</a>
        <a href="{{ "/blog/" | relative_url }}">Blog</a>
        <a href="https://kiyonokara.github.io/My-Portfolio/" target="_blank" rel="noopener noreferrer">Portfolio</a>
      </div>
      <button id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>{{ site.title }} - {{ site.time | date: "%Y" }} ・ Built with GitHub Pages</p>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      var root = document.documentElement;
      function apply(t) {
        root.setAttribute('data-theme', t);
      }
      var stored = localStorage.getItem('theme');
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      apply(stored || (sysDark ? 'dark' : 'light'));
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        apply(next);
      });
    })();
  </script>
</body>
</html>
